name: Autorelease (Publish to PyPI)

on:
  push:
    branches: [ release ]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
env:
  GITHUB_USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12.4" ]
        rdflib-version:
          - rdflib==6.3.2
          - rdflib==7.1.4
          - rdflib==7.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with ${{ matrix.rdflib-version }}
        run: |
          uv sync --group test --group dev
          uv add ${{ matrix.rdflib-version }}

      - name: Setup nanopub profile (including RSA keys)
        run: |
          uv run np setup --orcid-id https://orcid.org/0000-0000-0000-0000 --no-publish --name test --newkeys

      - name: Test with pytest
        run: uv run pytest

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12.4"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Release
        run: |
          npm ci
          npx semantic-release

      - name: Open PR to sync main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          gh pr create --base main --head release \
            --title "chore: sync release into main" \
            --body "Automated sync of release artifacts (version bump, CHANGELOG) into main." \
            || echo "A release->main PR already exists; skipping."
